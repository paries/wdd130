<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randys Rowdy Rafting</title>
    <meta name="description" content="Come Rafting with us at Randys Rowdy Rafting down the Arkansas.">
    <meta name="author" content="Randy Paries">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/rrrlogo.png" alt="Randys Rowdy Rafting Logo">
        <nav>
            <ul  class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="index">
        <div class="hero ">
            <img src="images/hero_index.jpg" alt="Randys Rowdy Rafting Index Page Hero Image">
            <h1>Randy's Rowdy Rafting</h1>
            <div class="call-to-action">
                <h2>Join the Adventure</h2>
                <a class="trips-button" href="trips.html">Book a Trip Now</a>
            </div>
        </div>
        <section class="index-middle">
            <h2>Services</h2>
            <div class="purpose-offerings">
                <figure>
                    <img src="images/index-teambuilding.jpg" alt="Team Building" >
                    <figcaption>Team Building</figcaption>
                </figure>
                <figure>
                    <img src="images/index-camping.jpg" alt="Camping" >
                    <figcaption>Camping</figcaption>
                </figure>
                <figure>
                    <img src="images/index-adventure.jpg" alt="Adventure" >
                    <figcaption>Adventure</figcaption>
                </figure>
            </div>
        </section>
        <section class="index-form">
            <div class="form">
                <form>
                    <h3>Newsletter Signup</h3>
                    <fieldset>
                        <div class="form-item column1">
                            <label for="contactname">Name:</label>
                            <input type="text" id="contactname" name="contactname" required placeholder="Name">
                        </div>
                        <div class="form-item column1">
                            <label for="contactemail">Email:</label>
                            <input type="email" id="contactemail" name="contactemail" required placeholder="Email">
                        </div>
                    </fieldset>
                    <div class="submit">
                        <input type="checkbox" name="subscribe" id="subscribe" checked>
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                        <button type="submit">Join!</button>
                    </div>

                </form>

            </div>
        </section>

    </main>

    <footer>
            <p>&copy; 2026 &#x1F6A3; Randys Rowdy Rafting &#x1F6A3; Randy Paries</p>
        <nav class="socialmedia">
            <ul>
                <li><a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a></li>
                <li><a href="https://tiktok.com">  <img src="images/tiktok.svg" alt="TikTok"></a></li>
                <li><a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a></li>
            </ul>
        </nav>
    </footer> 
</body>
</html>
