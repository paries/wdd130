<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us: Randys Rowdy Rafting</title>
    <meta name="description"
          content="Contact us at Randys Rowdy Rafting. General Inquiry, Reservation Questions, Website Suggestions">
    <meta name="author" content="Randy Paries">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
<header>
    <img src="images/rrrlogo.png" alt="Randys Rowdy Rafting Logo">
    <nav>
        <ul class="navigation">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="trips.html">Trips</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>
<main>
    <section class="contact-top">
        <div>
            <h1>Randys Rowdy Rafting</h1>
            <ul>
                <li>West Wetlands Park</li>
                <li>Yuma, AZ 85364</li>
                <li>Office: (928) 750-0247</li>
                <li>RandysRowdyRafting@gmail.com</li>
            </ul>
            
            
            
            
        </div>
    </section>  
    <section class="contact-middle">
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4746.103560527292!2d-114.6402356243392!3d32.72961617368349!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80d6f68cbd3de50b%3A0xfcb343b81d2cd92e!2sWest%20Wetlands%20Park!5e1!3m2!1sen!2sus!4v1790812952035!5m2!1sen!2sus"
                   allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <div class="form">
            <form>
                <fieldset>
                    <div class="form-item column1">
                        <label for="contactname">Name:</label>
                        <input type="text" id="contactname" name="contactname" required placeholder="Name">
                    </div>
                    <div class="form-item column1">
                        <label for="contactemail">Email:</label>
                        <input type="email" id="contactemail" name="contactemail" required placeholder="Email">
                    </div>
                </fieldset>

                <fieldset>
                    <div class="form-item column2">
                        <div> 
                            Message Purpose
                        </div>
                        <div>
                            <ul>
                                <li>
                                    <input type="radio" name="message_purpose" id="general_inquiry" value="general_inquiry">
                                    <label for="general_inquiry">General Inquiry</label>
                                </li>
                                <li>
                                    <input type="radio" name="message_purpose" id="reservation_question"
                                        value="reservation_question">
                                    <label for="reservation_question">Reservation Question</label>
                                </li>
                                <li>
                                    <input type="radio" name="message_purpose" id="website_suggestion"
                                        value="website_suggestion">
                                    <label for="website_suggestion">Website Suggestion</label>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="form-item message-row">
                        <label for="message">Message</label>
                        <textarea name="message" id="message"></textarea>
                    </div>
                </fieldset>

                <div class="submit">
                    <input type="checkbox" name="subscribe" id="subscribe" checked>
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    <button type="submit">Get in Touch!</button>
                </div>

            </form>
        </div>
    </section>

    <section class="contact-bottom">
        <h1>We Are Here to Serve you</h1>
        <div class="contact-profiles">
            <figure>
                <img src="images/profile1.jpg" alt="Walter White" >
                <figcaption>Head Tour Guide</figcaption>
            </figure>
            <figure>
                <img src="images/profile2.jpg" alt="Lydia Rodarte-Quayle" >
                <figcaption>Party Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/profile3.jpg" alt="Jessie Pinkman" >
                <figcaption>Bear Deterrent</figcaption>
            </figure>
        </div>
    </section>

</main>

<footer>
    <p>&copy; 2026 &#x1F6A3; Randys Rowdy Rafting &#x1F6A3; Randy Paries</p>
    <nav class="socialmedia">
        <ul>
            <li><a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a></li>
            <li><a href="https://tiktok.com"> <img src="images/tiktok.svg" alt="TikTok"></a></li>
            <li><a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a></li>
        </ul>
    </nav>
</footer>
</body>
</html>
